spring:
  application:
    name: diplomski-be
  datasource:
    url: jdbc:postgresql://localhost:5432/diplomski-postgres
    username: user
    password: pass
  jpa:
    hibernate:
      ddl-auto: validate # zelimo da Flyway bude jedini vlasnik schema promena
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        globally_quoted_identifiers: true
  flyway:
    enabled: true
    locations:
      - classpath:db/migration
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enabled: true
            required: true

jwt:
  secret-key: ${JWT_SECRET_KEY}
  access-token-expiration: 15m
  refresh-token-expiration: 7d
  refresh-token-cookie:
    name: refresh_token
    secure: true # set to false in application-local.yml if your client does not send Secure cookies over HTTP
    path: /auth

app:
  invitation-token: # invitation-based account activation
    duration-in-hours: 24

cors: # browser frontend (React dev server); override per environment
  allowed-origins:
    - http://localhost:5173
  allow-credentials: true

aws:
  region: eu-central-1
  endpoint: http://localhost:4566
  access-key: ${AWS_ACCESS_KEY_ID:test}
  secret-key: ${AWS_SECRET_ACCESS_KEY:test}
  s3:
    bucket: diplomski-documents
    key-prefix: documents/
    presigned-url-expiration: 15m
    path-style-access: true # required by LocalStack, false against real S3
  sqs:
    document-upload-queue: document-upload-events
  sns:
    # LocalStack account id is 000000000000; a real deployment uses its own account and region.
    document-ready-topic-arn: arn:aws:sns:eu-central-1:000000000000:document-ready-events
