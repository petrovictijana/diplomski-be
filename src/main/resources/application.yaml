spring:
  application:
    name: diplomski-be
  datasource:
    url: jdbc:postgresql://localhost:5432/diplomski-postgres
    username: user
    password: pass
  jpa:
    hibernate:
      ddl-auto: validate # zelimo da Flyway bude jedini vlasnik schema promena
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        globally_quoted_identifiers: true
  flyway:
    enabled: true
    locations:
      - classpath:db/migration
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enabled: true
            required: true

jwt:
  secret-key: ${JWT_SECRET_KEY}
  access-token-expiration: 15m
  refresh-token-expiration: 7d
  refresh-token-cookie:
    name: refresh_token
    secure: true # set to false in application-local.yml if your client does not send Secure cookies over HTTP
    path: /auth

app:
  invitation-token: # invitation-based account activation
    duration-in-hours: 24

