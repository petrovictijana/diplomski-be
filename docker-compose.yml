services:
  postgres:
    image: postgres:16
    container_name: diplomski-postgres
    environment:
      POSTGRES_DB: diplomski-be
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U user -d diplomski-be" ]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3 + SQS emulator. Nothing is persisted between restarts, so the bootstrap
  # script under localstack/init/ready.d runs on every startup and must stay idempotent.
  localstack:
    image: localstack/localstack:4
    container_name: diplomski-localstack
    environment:
      SERVICES: s3,sqs
      AWS_DEFAULT_REGION: eu-central-1
      # Dummy credentials - LocalStack does not validate them, but the SDK requires both
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    ports:
      - "4566:4566"
    volumes:
      - ./localstack/init/ready.d:/etc/localstack/init/ready.d:ro
    healthcheck:
      test: [ "CMD-SHELL", "awslocal s3api head-bucket --bucket diplomski-bucket" ]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 20s
